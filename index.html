<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Trip Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
}
.button{
    display:block;
    max-width:350px;
    margin:15px auto;
    padding:20px;
    font-size:22px;
    text-decoration:none;
    color:black;
    background:white;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    border:none;
    cursor:pointer;
}
.button:active{
    transform:scale(.98);
}
</style>
</head>

<body>

<h1>🚗 Road Trip</h1>

<button class="button" onclick="saveCar()">
🚘 Save My Car
</button>

<button class="button" onclick="findCar()">
🔍 Find My Car
</button>

<a class="button" href="https://www.google.com/maps/search/gas+station">
⛽ Gas Station
</a>

<a class="button" href="https://www.google.com/maps/search/halal+restaurant">
🍗 Halal Restaurant
</a>

<a class="button" href="https://www.google.com/maps/search/supermarket">
🛒 Supermarket
</a>

<a class="button" href="https://www.google.com/maps/search/parking">
🅿️ Parking
</a>

<a class="button" href="https://www.google.com/maps/search/public+toilet">
🚻 Toilettes
</a>

<a class="button" href="https://www.google.com/maps/search/coffee">
☕ Coffee
</a>

<a class="button" href="https://www.google.com/maps/search/hospital">
🏥 Hospital
</a>

<script>
function saveCar(){

    if(!navigator.geolocation){
        alert("Geolocation is not supported.");
        return;
    }

    navigator.geolocation.getCurrentPosition(function(position){

        const car={
            lat:position.coords.latitude,
            lng:position.coords.longitude,
            time:new Date().toLocaleString()
        };

        localStorage.setItem("carLocation",JSON.stringify(car));

        alert("🚘 Car location saved!");

    },function(){
        alert("Unable to get your location.");
    });

}

function findCar(){

    const car=JSON.parse(localStorage.getItem("carLocation"));

    if(!car){
        alert("No saved car location.");
        return;
    }

    window.location.href=`https://www.google.com/maps/dir/?api=1&destination=${car.lat},${car.lng}`;
}
</script>

</body>
</html>
